<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/spa/rest-countries-app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor Project Vanilla JS</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/fonts/fontawesome-free-7.1.0-web/css/all.min.css">
  <script type="module" src="./assets/js/app.js"></script>
</head>
<body class="light-mode">
  <header class="header">
    <h1 class="header__title">Where in the world?</h1>
    <button class="header__btn" id="btn-theme-mode">
      <i class="fa-regular fa-moon" id="icon-theme"></i>
      <span class="btn__span" id="span-theme">Dark Mode</span>
    </button>
  </header>

  <main class="main">
    <section class="main__search" id="search-module">
      <form action="#" class="search__form" id="search-form">
        <input type="text" class="form__input" placeholder="Search for a country..." id="search-input">
        <button type="submit" class="form__btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <select class="search__region" id="search-region">
        <option value="">Filter By Region</option>
        <option value="Africa">Africa</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
      </select>
    </section>

    <section class="main__countries" id="countries-module">
    </section>

    <section class="main__country hidden" id="country-detail-module">
      <div class="country__btn">
        <button class="btn__back" id="btn-back">
          <i class="fa-solid fa-arrow-left"></i>
          <span class="back__span">Back</span>
        </button>
      </div>
      <article class="country__detail" id="detail-container-module"></article>
    </section>

    <section class="main__error hidden" id="error-module">
      <button class="error__back" id="btn-error-back">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="back__span">Go Back Home</span>
      </button>
      <h1 class="error__title">404</h1>
      <p class="error__p">Resource not found</p>
    </section>
  </main>
</body>
</html>
