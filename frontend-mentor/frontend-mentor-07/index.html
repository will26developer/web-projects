<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frontend Mentor Project 07</title>
  <link href="./assets/css/styles.css" rel="stylesheet">
  <link rel="shortcut icon" href="./assets/img/images/favicon-32x32.png" type="image/x-icon">
  <script type="text/javascript" src="./assets/js/scripts.js"></script>
</head>

<body>
  <main class="container">
    <section class="container__announce">
      <h1 class="announce__title">Learn to code by watching others</h1>
      <p class="announce__p">See how experienced developers solve problems in real-time. Watching scripted tutorials is
        great,
        but understanding how developers think is invaluable.</p>
    </section>
    <section class="container__form">
      <span class="form__banner"><strong class="banner__strong">Try it free 7 days</strong> then $20/mo. thereafter</span>
      <form action="#" class="form__form">
        <label for="first-name" class="form__label">
          <img src="./assets/img/images/icon-error.svg" alt="icon-error" class="label__error hidden">
          <input type="text" id="first-name" class="label__input" placeholder="First Name">
          <span class="label__alert" id="first-name-alert"></span>
        </label>
        <label for="last-name" class="form__label">
          <img src="./assets/img/images/icon-error.svg" alt="icon-error" class="label__error hidden">
          <input type="text" id="last-name" class="label__input" placeholder="Last Name">
          <span class="label__alert" id="last-name-alert"></span>
        </label>
        <label for="email" class="form__label">
          <img src="./assets/img/images/icon-error.svg" alt="icon-error" class="label__error hidden">
          <input type="text" id="email" class="label__input" placeholder="Email Address">
          <span class="label__alert" id="email-alert"></span>
        </label>
        <label for="password" class="form__label">
          <img src="./assets/img/images/icon-error.svg" alt="icon-error" class="label__error hidden">
          <input type="text" id="password" class="label__input" placeholder="Password">
          <span class="label__alert" id="password-alert"></span>
        </label>
        <input type="submit" value="Claim your free trial" class="form__submit">
        <p class="form__disclaim">By clicking the button, you are agreeing to our <a href="#" class="disclaim__link">Terms and Services</a></p>
      </form>
    </section>
  </main>
</body>

</html>
