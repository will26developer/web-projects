<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor Project 09</title>
  <link rel="shortcut icon" href="./assets/img/images/favicon-32x32.png" type="image/x-icon">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/scripts.js"></script>
</head>
<body>
  <header class="header">
    <div class="header__logo">
      <img src="./assets/img/images/logo.svg" alt="icon-logo" class="logo__hero">
    </div>
    <div class="header__scores">
      <div class="score__item">
        <span class="item__span">player score</span>
        <p class="item__p" id="score-player">0</p>
      </div>
      <div class="score__item">
        <span class="item__span">house score</span>
        <p class="item__p" id="score-house">0</p>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="main__select" id="select-option">
      <div class="select__wrap"  id="paper">
        <div class="wrap__img wrap__blue">
          <img src="./assets/img/images/icon-paper.svg" alt="icon-paper" class="img__hero">
        </div>
      </div>
      <div class="select__wrap"  id="scissors">
        <div class="wrap__img wrap__yellow">
          <img src="./assets/img/images/icon-scissors.svg" alt="icon-scissors" class="img__hero">
        </div>
      </div>
      <div class="select__wrap"  id="rock">
        <div class="wrap__img wrap__red">
          <img src="./assets/img/images/icon-rock.svg" alt="icon-rock" class="img__hero" >
        </div>
      </div>
    </section>
    <section class="main__results hidden" id="show-results">
      <div class="result__wrap">
        <div class="wrap__picked wrap__img" id="wrap-player">
          <img src="" alt="picked-player" class="picked__hero" id="player-picked">
        </div>
      </div>
      <div class="result__message">
        <span class="message__span" id="message"></span>
        <button type="button" class="message__btn" id="btn-again">play again</button>
        <button type="button" class="message__btn-reset hidden" id="btn-reset">reset game</button>
      </div>
      <div class="result__wrap">
        <div class="wrap__picked wrap__img" id="wrap-house">
          <img src="" alt="picked-house" class="picked__hero" id="house-picked">
        </div>
      </div>
    </section>
    <section class="main__rules hidden" id="show-rules">
      <div class="rules__container">
        <span class="container__span">rules</span>
      </div>
      <button type="button" class="rules__close" id="btn-close">X</button>
      <div class="rules__illustration">
        <img src="./assets/img/images/image-rules.svg" alt="illustration-rules" class="illustration__hero">
      </div>
    </section>
  </main>
  <footer class="footer">
    <button type="button" class="footer__rules" id="btn-rules">rules</button>
  </footer>
</body>
</html>
