<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor Project 03</title>
  <link rel="stylesheet"
    href="../../frontend-mentor/frontend-mentor-03/assets/fonts/fontawesome-free-7.1.0-web/css/all.min.css">
  <link rel="stylesheet" href="../../frontend-mentor/frontend-mentor-03/assets/css/styles.css">
  <script type="module" src="../../frontend-mentor/frontend-mentor-03/assets/js/script.js"></script>
</head>

<body class="light-theme" id="body-bg">
  <header class="header">
    <h1 class="header__title">Where in the world?</h1>
    <button class="header__btn" id="theme-btn"><i class="fa-regular fa-moon" id="theme-icon"></i><span
        class="theme___span" id="theme-text">Dark Mode</span></button>
  </header>
  <main class="main">
    <section class="main__choice" id="container-choice">
      <form action="#" class="choice__form" id="form-country">
        <input type="text" name="choice-name" class="form__input" id="input-country">
        <button type="submit" class="form__btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>
      <select name="choice-region" id="select-region">
        <option value="">Filter By Region</option>
        <option value="Africa">Africa</option>
        <option value="Americas">America</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
        <option value="Asia">Asia</option>
      </select>
    </section>
    <section class="main__countries" id="countries-container">
    </section>
    <section class="main__details hidden" id="country-details">
      <div class="details__btn">
        <button type="button" class="btn__back" id="btn-back"><i class="fa-solid fa-arrow-left"></i><span
            class="back__span">Back</span></button>
      </div>
      <div class="details__container" id="details-container">
      </div>
    </section>
    <section class="main__error hidden" id="error-container">
      <button class="error__back" id="btn-error-back">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="back__span">Go Back Home</span>
      </button>
      <h1 class="error__title">404</h1>
      <p class="error__p" id="error-message"></p>
    </section>
    <div class="loading-overlay hidden" id="loading-spinner">
      <div class="spinner"></div>
    </div>

  </main>
</body>

</html>
