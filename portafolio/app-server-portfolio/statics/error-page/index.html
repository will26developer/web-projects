<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 - Page not found | William's Portfolio">
    <title>404 - Page Not Found | WILL26.DEV</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/error-page/assets/css/styles.css">
</head>
<body>
    
    <div class="error">
        <div class="error__container">
            
            <!-- Glitch Effect on 404 -->
            <div class="error__code" data-text="404">404</div>
            
            <h1 class="error__title">Page Not Found</h1>
            
            <p class="error__message">
                The page you're looking for seems to
                 have wandered off into the void. 
                <span class="error__emoji">🚀</span>
            </p>
            
            <div class="error__details">
                <span class="error__bracket">[</span>
                <span class="error__path">Error: ENOENT</span>
                <span class="error__bracket">]</span>
            </div>
            
            <div class="error__actions">
                <a href="/main" class="btn btn--primary">
                    <i class="icon">←</i>
                    Back to Home
                </a>
                <a href="/main#archive" class="btn btn--secondary">
                    Browse Projects
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
